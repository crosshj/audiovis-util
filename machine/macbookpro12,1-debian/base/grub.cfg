set default=0
set timeout=3
menuentry 'Debian headless live (copy system to RAM)' {
    search --no-floppy --label DEBIAN --set=debian
    set root=$debian
    linux /live/vmlinuz boot=live components toram noswap systemd.gpt_auto=no live-config.hooks=file:///run/live/medium/live/config-hooks/0100-audiovis-util systemd.unit=multi-user.target
    initrd /live/initrd.img
}
