name: Build Audio Utility app

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
#   build-alpine:
#     runs-on: ubuntu-24.04
#     steps:
#       - uses: actions/checkout@v4
#       - name: Build Alpine SDL/musl target
#         run: |
#           docker run --rm -v "$GITHUB_WORKSPACE:/workspace" -w /workspace \
#             golang:1.26-alpine3.24 sh -eu -c \
#             'apk add --no-cache build-base >/dev/null && machine/macbookpro12,1-alpine/app/build.sh /workspace/build/audio-utility-alpine-amd64'
#       - name: Upload Alpine binary
#         uses: actions/upload-artifact@v4
#         with:
#           name: audio-utility-alpine-amd64
#           path: build/audio-utility-alpine-amd64
#           if-no-files-found: error
#           retention-days: 30

  build-debian:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      - name: Build Debian GPU dashboard bundle
        run: machine/macbookpro12,1-debian/app/build.sh "$GITHUB_WORKSPACE/build/audio-utility-debian"
      - name: Upload Debian bundle
        uses: actions/upload-artifact@v4
        with:
          name: audio-utility-debian-amd64
          path: build/audio-utility-debian/audio-utility-debian-amd64.tar.gz
          if-no-files-found: error
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-debian]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # Alpine release asset is paused with its build job:
      # - uses: actions/download-artifact@v4
      #   with:
      #     name: audio-utility-alpine-amd64
      #     path: release
      - uses: actions/download-artifact@v4
        with:
          name: audio-utility-debian-amd64
          path: release
      - name: Publish Debian release asset
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Re-enable the Alpine asset argument when the Alpine job is restored.
          # release/audio-utility-alpine-amd64
          gh release create "$GITHUB_REF_NAME" \
            release/audio-utility-debian-amd64.tar.gz \
            --title "Audio Utility $GITHUB_REF_NAME" \
            --generate-notes
