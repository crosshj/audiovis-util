name: Build Audio Utility app

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-macbookpro12-1:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build MacBookPro12,1 Linux target
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/workspace" -w /workspace \
            golang:1.26-alpine3.24 sh -eu -c \
            'apk add --no-cache build-base >/dev/null && machine/macbookpro12,1/app/build.sh'
      - name: Upload target binary
        uses: actions/upload-artifact@v4
        with:
          name: audio-utility-macbookpro12,1-linux-amd64
          path: build/macbookpro12,1/audio-utility
          if-no-files-found: error
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-macbookpro12-1
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: audio-utility-macbookpro12,1-linux-amd64
          path: release
      - name: Publish machine release asset
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release/audio-utility \
            --title "Audio Utility $GITHUB_REF_NAME" \
            --generate-notes
